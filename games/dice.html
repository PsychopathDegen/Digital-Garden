<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dice — PlayStake</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  /* App layout overrides for the game page */
  body { background-color: #000; display: flex; justify-content: center; margin: 0; }
  .app-container { max-width: 480px; width: 100%; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; position: relative; }
  .content-area { padding: 14px; flex: 1; padding-bottom: 90px; }

  /* Game Panel */
  .game-panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 20px 16px;
    margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 30px;
  }

  /* --- Custom Slider --- */
  .slider-wrapper {
    position: relative; padding: 20px 10px;
  }
  .slider-labels {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 12px;
  }
  .slider-track-container {
    height: 32px; background: var(--panel2); border-radius: 16px;
    position: relative; display: flex; align-items: center;
    padding: 0 4px; box-sizing: border-box;
    cursor: pointer;
  }
  .slider-fill {
    position: absolute; top: 8px; bottom: 8px; left: 4px; right: 4px;
    border-radius: 8px; display: flex; overflow: hidden; pointer-events: none;
  }
  .fill-red { background: #ff3b3b; height: 100%; transition: width 0.05s linear; }
  .fill-green { background: #00e701; height: 100%; transition: width 0.05s linear; }
  
  /* The draggable handle */
  .slider-handle {
    position: absolute;
    width: 46px; height: 38px; background: #2d9cdb;
    border-radius: 6px; border: 2px solid #1e6b9e;
    display: flex; align-items: center; justify-content: center;
    top: -5px; transform: translateX(-50%);
    z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    cursor: grab;
  }
  .slider-handle::before {
    content: "❘❘❘"; color: #1e6b9e; font-size: 1.2rem; letter-spacing: -2px;
  }
  
  /* Actual input range hidden underneath for interaction */
  input[type=range] {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; z-index: 10; margin: 0;
  }

  /* --- Input Grid --- */
  .input-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
  }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .input-box {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; display: flex; align-items: center; padding: 10px 12px;
    height: 46px; box-sizing: border-box;
  }
  .input-box input {
    background: transparent; border: none; color: white;
    font-size: 1rem; font-weight: 700; width: 100%; outline: none;
  }
  .input-box span { color: var(--muted); font-weight: 600; margin-left: 4px; }
  .swap-icon { color: var(--text); cursor: pointer; font-size: 1.2rem; margin-left: 4px; }

  /* --- Bet Controls --- */
  .bet-btn {
    width: 100%; background: #1475e1; color: white; font-size: 1.1rem; font-weight: 800;
    padding: 16px; border: none; border-radius: 8px; cursor: pointer;
    margin-bottom: 16px; transition: 0.1s;
  }
  .bet-btn:active { transform: scale(0.98); background: #0f5bb5; }
  .bet-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .bet-amount-row { display: flex; flex-direction: column; gap: 16px; }
  .bet-input-group { display: flex; flex-direction: column; gap: 6px; }
  .bet-label-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .bet-label-row span:last-child { color: var(--text); }
  
  .main-input-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; display: flex; align-items: center; height: 48px; overflow: hidden;
  }
  .main-input-box input {
    flex: 1; background: transparent; border: none; color: white;
    padding: 0 14px; font-size: 1rem; font-weight: 600; outline: none;
  }
  .main-input-box .currency-icon { padding: 0 12px; color: #26A17B; font-size: 1.2rem; }
  
  .quick-btns { display: flex; border-left: 1px solid var(--border); height: 100%; }
  .quick-btns button {
    background: var(--panel2); color: var(--text); border: none;
    padding: 0 16px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
    border-left: 1px solid var(--border);
  }
  .quick-btns button:hover { background: #2a3f50; }
  .quick-btns button:first-child { border-left: none; }

  /* Result Text */
  .result-overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 3rem; font-weight: 900; text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.2s;
  }
  .result-overlay.show { opacity: 1; }
  .result-overlay.win { color: var(--accent); }
  .result-overlay.loss { color: #ff3b3b; }
</style>
</head>
<body>

<div class="app-container">
  <!-- Top Header -->
  <header class="topbar">
    <div class="brand" onclick="location.href='../index.html'">S</div>
    <div class="balance-pill" onclick="openDeposit()">
      <span id="balanceDisplay">0.00000000</span>
      <span class="coin">₮</span>
      <span class="dropdown-arrow">⌄</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn wallet-blue" onclick="openWallet()">💼</button>
      <button class="icon-btn">👤</button>
      <button class="icon-btn">🔔</button>
    </div>
  </header>

  <main class="content-area">
    <!-- Top Game Area -->
    <div class="game-panel" style="position: relative;">
      
      <div class="result-overlay" id="resultDisplay">50.00</div>

      <div class="slider-wrapper">
        <div class="slider-labels">
          <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
        </div>
        
        <div class="slider-track-container" id="trackContainer">
          <div class="slider-fill">
            <div id="fillRed" class="fill-red" style="width: 50.5%;"></div>
            <div id="fillGreen" class="fill-green" style="width: 49.5%;"></div>
          </div>
          <div id="sliderHandle" class="slider-handle" style="left: 50.5%;"></div>
          <input type="range" id="diceSlider" min="2" max="98" step="0.01" value="50.50" oninput="updateSlider()" />
        </div>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label>Multiplier</label>
          <div class="input-box">
            <input type="text" id="multiplierDisplay" value="2.0000" readonly />
            <span>×</span>
          </div>
        </div>
        <div class="input-group">
          <label>Roll Over</label>
          <div class="input-box" style="cursor: pointer;" onclick="swapMode()">
            <input type="text" id="rollOverDisplay" value="50.50" readonly style="cursor: pointer;"/>
            <span class="swap-icon">⇄</span>
          </div>
        </div>
        <div class="input-group">
          <label>Win Chance</label>
          <div class="input-box">
            <input type="text" id="winChanceDisplay" value="49.5000" readonly />
            <span>%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Betting Area -->
    <div class="game-panel" style="gap: 16px;">
      <button id="betBtn" class="bet-btn" onclick="playDice()">Bet</button>

      <div class="bet-amount-row">
        <div class="bet-input-group">
          <div class="bet-label-row">
            <span>Bet Amount</span>
            <span id="betFiatDisplay">$0.00</span>
          </div>
          <div class="main-input-box">
            <input type="number" id="betAmountInput" value="0.00000000" step="0.00000001" oninput="updateProfit()" />
            <span class="currency-icon">₮</span>
            <div class="quick-btns">
              <button onclick="setBet('half')">½</button>
              <button onclick="setBet('double')">2×</button>
            </div>
          </div>
        </div>

        <div class="bet-input-group">
          <div class="bet-label-row">
            <span>Profit on Win</span>
            <span id="profitFiatDisplay">$0.00</span>
          </div>
          <div class="main-input-box">
            <input type="text" id="profitInput" value="0.00000000" readonly />
            <span class="currency-icon">₮</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modals (Same as index) -->
<div class="modal-overlay" id="depositModal">
  <div class="modal">
    <div class="modal-head"><h2>Deposit USDT</h2><button class="close" onclick="closeDeposit()">✕</button></div>
    <div class="modal-body">
      <label class="lbl">Network</label>
      <select id="networkSelect" class="input"><option>TRC20 (Tron)</option><option>ERC20 (Ethereum)</option></select>
      <label class="lbl">Deposit address</label>
      <div class="addr-row"><code id="fakeAddress">TXk9...fake...9Qz</code><button class="btn ghost small" onclick="copyAddress()">Copy</button></div>
      <div class="qr-wrap"><canvas id="qrCanvas" width="140" height="140"></canvas><p class="muted tiny">Scan (fake)</p></div>
      <label class="lbl">Amount to credit (USDT)</label>
      <input type="number" id="depositAmount" class="input" placeholder="e.g. 1000" />
      <button class="btn wide" onclick="confirmDeposit()">I've paid — Confirm deposit</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="walletModal">
  <div class="modal wide-modal">
    <div class="modal-head"><h2>Wallet & Stats</h2><button class="close" onclick="closeWallet()">✕</button></div>
    <div class="modal-body">
      <div class="stats-grid">
        <div class="stat"><span id="statBets">0</span><small>Total bets</small></div>
        <div class="stat"><span id="statWagered">0.00</span><small>Wagered</small></div>
        <div class="stat"><span id="statProfit">0.00</span><small>Net profit</small></div>
      </div>
      <h3 class="hist-title">Bet history</h3>
      <div class="history-list" id="historyList"></div>
      <div class="wallet-actions">
        <button class="btn ghost small" onclick="resetBalance()">Reset balance</button>
        <button class="btn ghost small" onclick="clearHistory()">Clear history</button>
      </div>
    </div>
  </div>
</div>

<script src="../app.js"></script>
<script>
  let targetValue = 50.50;
  let isRolling = false;
  let currentMultiplier = 2.0000;
  let isUnder = false; // Stake default is usually Roll Over

  // Update slider visuals
  function updateSlider() {
    if (isRolling) return;
    
    targetValue = parseFloat(document.getElementById('diceSlider').value);
    
    // Update UI elements
    document.getElementById('sliderHandle').style.left = targetValue + '%';
    document.getElementById('rollOverDisplay').value = targetValue.toFixed(2);
    
    // Calculate Red/Green zones
    const fillRed = document.getElementById('fillRed');
    const fillGreen = document.getElementById('fillGreen');
    
    if (isUnder) {
      // Under: Green is 0 to target, Red is target to 100
      fillRed.style.width = (100 - targetValue) + '%';
      fillGreen.style.width = targetValue + '%';
    } else {
      // Over: Red is 0 to target, Green is target to 100
      fillRed.style.width = targetValue + '%';
      fillGreen.style.width = (100 - targetValue) + '%';
    }

    // Win Chance & Multiplier Math (99% RTP)
    let winChance = isUnder ? targetValue : (100 - targetValue);
    currentMultiplier = 99 / winChance;
    
    document.getElementById('multiplierDisplay').value = currentMultiplier.toFixed(4);
    document.getElementById('winChanceDisplay').value = winChance.toFixed(4);
    
    updateProfit();
  }

  // Swap between Roll Over / Roll Under
  function swapMode() {
    if (isRolling) return;
    isUnder = !isUnder;
    updateSlider();
  }

  // Update the "Profit on Win" text dynamically
  function updateProfit() {
    const bet = parseFloat(document.getElementById('betAmountInput').value) || 0;
    const profit = bet * currentMultiplier - bet; // Payout minus original bet
    const potentialPayout = bet * currentMultiplier;
    
    document.getElementById('profitInput').value = profit > 0 ? profit.toFixed(8) : "0.00000000";
    document.getElementById('betFiatDisplay').textContent = '$' + bet.toFixed(2);
    document.getElementById('profitFiatDisplay').textContent = '$' + (profit > 0 ? profit.toFixed(2) : "0.00");
  }

  // 1/2 and 2x buttons
  function setBet(action) {
    if (isRolling) return;
    const input = document.getElementById('betAmountInput');
    let current = parseFloat(input.value) || 0;
    
    if (action === 'half') current = current / 2;
    if (action === 'double') current = current * 2;
    
    if (current > state.balance) current = state.balance;
    if (current < 0) current = 0;
    
    input.value = current.toFixed(8);
    updateProfit();
  }

  // Main Game Logic
  function playDice() {
    if (isRolling) return;

    const betAmt = parseFloat(document.getElementById('betAmountInput').value);
    if (!betAmt || betAmt <= 0) { flash("Invalid bet amount"); return; }
    if (betAmt > state.balance) { flash("Insufficient balance"); return; }

    // Deduct balance
    if (!placeBet('Dice', betAmt)) return;

    isRolling = true;
    const btn = document.getElementById('betBtn');
    btn.disabled = true;
    btn.textContent = "Rolling...";

    // Provably Fair logic
    getSeeds('dice');
    nextNonce('dice');
    
    // Determine Roll
    const finalRoll = Math.random() * 100;
    
    // Slider Animation Logic
    const handle = document.getElementById('sliderHandle');
    const sliderInput = document.getElementById('diceSlider');
    
    // Animate to 100, then back to final roll
    let progress = 0;
    let animSpeed = 5; // ms per step
    let animPhase = 1; // 1: fly right, 2: settle left
    
    // Hide input during animation
    sliderInput.style.display = 'none';

    // We temporarily override the UI handle movement without triggering calculation
    function animate() {
      if (animPhase === 1) {
        progress += 3;
        if (progress >= 100) { progress = 100; animPhase = 2; }
        handle.style.left = progress + '%';
        setTimeout(animate, animSpeed);
      } else if (animPhase === 2) {
        // Drop back to finalRoll
        const distance = progress - finalRoll;
        if (distance <= 0.1) {
          handle.style.left = finalRoll + '%';
          finishGame(finalRoll, betAmt);
        } else {
          // Ease out
          progress -= Math.max(0.5, distance * 0.1);
          handle.style.left = progress + '%';
          setTimeout(animate, animSpeed);
        }
      }
    }
    
    animate();
  }

  function finishGame(roll, betAmt) {
    const resultDisplay = document.getElementById('resultDisplay');
    const sliderInput = document.getElementById('diceSlider');
    
    // Check Win
    let win = false;
    if (isUnder) win = roll < targetValue;
    else win = roll > targetValue;

    // Show Result text
    resultDisplay.textContent = roll.toFixed(2);
    resultDisplay.className = 'result-overlay show ' + (win ? 'win' : 'loss');
    
    // Calculate payout
    const payout = win ? (betAmt * currentMultiplier) : 0;
    
    if (win) {
      state.balance += payout;
      playSound('win');
    } else {
      playSound('lose');
    }

    // Record stats
    recordBet({ game: 'Dice', amount: betAmt, payout: payout, win: win });

    // Reset UI after delay
    setTimeout(() => {
      resultDisplay.classList.remove('show');
      sliderInput.style.display = 'block';
      document.getElementById('betBtn').disabled = false;
      document.getElementById('betBtn').textContent = "Bet";
      isRolling = false;
      
      // Force slider to reflect the actual target again
      updateSlider();
    }, 1500);
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    // Set initial bet to 0
    document.getElementById('betAmountInput').value = "0.00000000";
    updateSlider();
  });
</script>
</body>
</html>
