<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dice — PlayStake</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background-color: #000; display: flex; justify-content: center; margin: 0; touch-action: pan-y; font-family: 'Segoe UI', system-ui, sans-serif; }
  .app-container { max-width: 480px; width: 100%; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; position: relative; }
  .content-area { padding: 14px; flex: 1; padding-bottom: 90px; }

  /* History Bar - Populates from Right to Left */
  .history-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: flex-end; overflow: hidden; }
  .history-pill {
    background: var(--panel); color: var(--text); font-weight: 700; font-size: 0.85rem;
    padding: 8px 16px; border-radius: 20px; min-width: 60px; text-align: center;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .history-pill.win { background: #00e701; color: #000; }
  .history-pill.loss { background: var(--panel2); color: var(--muted); }

  /* Game Panel */
  .game-panel {
    background: var(--panel); border-radius: 12px; padding: 20px 16px;
    margin-bottom: 16px; display: flex; flex-direction: column; gap: 30px;
  }

  /* --- Custom Slider (Thinner) --- */
  .slider-wrapper { position: relative; padding: 20px 10px 0 10px; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 12px; pointer-events: none;}
  
  .slider-track-container {
    height: 20px; /* Thinner track */
    background: var(--panel2); border-radius: 10px;
    position: relative; display: flex; align-items: center;
    padding: 0 4px; box-sizing: border-box; cursor: pointer;
    touch-action: none;
  }
  
  /* The red and green fill zones */
  .slider-fill {
    position: absolute; top: 2px; bottom: 2px; border-radius: 8px;
    display: flex; overflow: hidden; pointer-events: none;
    left: 4px; right: 4px;
  }
  .fill-red { background: #ff3b3b; height: 100%; position: absolute; left: 0; }
  .fill-green { background: #00e701; height: 100%; position: absolute; right: 0; }
  
  /* The draggable handle */
  .slider-handle {
    position: absolute; width: 46px; height: 34px; background: #2d9cdb;
    border-radius: 6px; border: 2px solid #1e6b9e;
    display: flex; align-items: center; justify-content: center;
    top: -5px; transform: translateX(-50%);
    z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: grab;
    touch-action: none;
  }
  .slider-handle::before { content: "❘❘❘"; color: #1e6b9e; font-size: 1.1rem; letter-spacing: -2px; pointer-events: none;}
  
  /* Floating Result Cube */
  .result-cube {
    position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
    width: 50px; height: 50px; background: white;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 1rem; color: #ff3b3b;
    opacity: 0; pointer-events: none; z-index: 10;
  }
  .result-cube::after {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.1) 50%);
    clip-path: inherit;
  }

  /* --- Input Grid --- */
  .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .input-box {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; display: flex; align-items: center; padding: 10px 12px;
    height: 46px; box-sizing: border-box;
  }
  .input-box input {
    background: transparent; border: none; color: white;
    font-size: 16px; font-weight: 700; width: 100%; outline: none;
  }
  .input-box span { color: var(--muted); font-weight: 600; margin-left: 4px; }
  .swap-icon { color: var(--text); cursor: pointer; font-size: 1.2rem; margin-left: 4px; }

  /* --- Bet Controls --- */
  .bet-btn {
    width: 100%; background: #1475e1; color: white; font-size: 1.1rem; font-weight: 800;
    padding: 16px; border: none; border-radius: 8px; cursor: pointer;
    margin-bottom: 16px; transition: 0.1s;
  }
  .bet-btn:active { transform: scale(0.98); background: #0f5bb5; }
  .bet-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .bet-amount-row { display: flex; flex-direction: column; gap: 16px; }
  .bet-input-group { display: flex; flex-direction: column; gap: 6px; }
  .bet-label-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .bet-label-row span:last-child { color: var(--text); }
  
  .main-input-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; display: flex; align-items: center; height: 48px; overflow: hidden;
  }
  .main-input-box input {
    flex: 1; background: transparent; border: none; color: white;
    padding: 0 14px; font-weight: 600; outline: none; font-size: 16px;
  }
  .main-input-box .currency-icon { padding: 0 12px; color: #26A17B; font-size: 1.2rem; }
  
  .quick-btns { display: flex; border-left: 1px solid var(--border); height: 100%; }
  .quick-btns button {
    background: var(--panel2); color: var(--text); border: none;
    padding: 0 16px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
    border-left: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="app-container">
  <header class="topbar">
    <div class="brand" onclick="location.href='../index.html'">S</div>
    <div class="balance-pill" onclick="openDeposit()">
      <span id="balanceDisplay">0.00000000</span>
      <span class="coin">₮</span>
      <span class="dropdown-arrow">⌄</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn wallet-blue" onclick="openWallet()">💼</button>
      <button class="icon-btn">👤</button>
      <button class="icon-btn">🔔</button>
    </div>
  </header>

  <main class="content-area">
    
    <!-- History Bar -->
    <div class="history-bar" id="historyBar"></div>

    <div class="game-panel">
      <div class="slider-wrapper">
        <div class="slider-labels">
          <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
        </div>
        
        <div class="slider-track-container" id="trackContainer">
          <div class="slider-fill">
            <div id="fillRed" class="fill-red" style="width: 50.5%;"></div>
            <div id="fillGreen" class="fill-green" style="width: 49.5%;"></div>
          </div>
          <div id="sliderHandle" class="slider-handle" style="left: 50.5%;">
            <div id="resultCube" class="result-cube">50.00</div>
          </div>
        </div>
      </div>

      <div class="input-grid">
        <div class="input-group">
          <label>Multiplier</label>
          <div class="input-box">
            <input type="number" id="multiplierInput" value="1.9800" step="0.0001" onchange="updateFromMultiplier()" />
            <span>×</span>
          </div>
        </div>
        <div class="input-group">
          <label>Roll Over</label>
          <div class="input-box" style="cursor: pointer;">
            <input type="number" id="rollOverInput" value="50.50" step="0.01" onchange="updateFromRollOver()" style="cursor: text;"/>
            <span class="swap-icon" onclick="swapMode()">⇄</span>
          </div>
        </div>
        <div class="input-group">
          <label>Win Chance</label>
          <div class="input-box">
            <input type="number" id="winChanceInput" value="49.5000" step="0.0001" onchange="updateFromWinChance()" />
            <span>%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="game-panel" style="gap: 16px;">
      <button id="betBtn" class="bet-btn" onclick="playDice()">Bet</button>

      <div class="bet-amount-row">
        <div class="bet-input-group">
          <div class="bet-label-row">
            <span>Bet Amount</span>
            <span id="betFiatDisplay">$0.00</span>
          </div>
          <div class="main-input-box">
            <input type="number" id="betAmountInput" value="0.00000000" step="0.00000001" oninput="updateProfit()" />
            <span class="currency-icon">₮</span>
            <div class="quick-btns">
              <button onclick="setBet('half')">½</button>
              <button onclick="setBet('double')">2×</button>
            </div>
          </div>
        </div>

        <div class="bet-input-group">
          <div class="bet-label-row">
            <span>Profit on Win</span>
            <span id="profitFiatDisplay">$0.00</span>
          </div>
          <div class="main-input-box">
            <input type="text" id="profitInput" value="0.00000000" readonly />
            <span class="currency-icon">₮</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="depositModal">
  <div class="modal">
    <div class="modal-head"><h2>Deposit USDT</h2><button class="close" onclick="closeDeposit()">✕</button></div>
    <div class="modal-body">
      <label class="lbl">Network</label>
      <select id="networkSelect" class="input"><option>TRC20 (Tron)</option><option>ERC20 (Ethereum)</option></select>
      <label class="lbl">Deposit address</label>
      <div class="addr-row"><code id="fakeAddress">TXk9...fake...9Qz</code><button class="btn ghost small" onclick="copyAddress()">Copy</button></div>
      <div class="qr-wrap"><canvas id="qrCanvas" width="140" height="140"></canvas><p class="muted tiny">Scan (fake)</p></div>
      <label class="lbl">Amount to credit (USDT)</label>
      <input type="number" id="depositAmount" class="input" placeholder="e.g. 1000" />
      <button class="btn wide" onclick="confirmDeposit()">I've paid — Confirm deposit</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="walletModal">
  <div class="modal wide-modal">
    <div class="modal-head"><h2>Wallet & Stats</h2><button class="close" onclick="closeWallet()">✕</button></div>
    <div class="modal-body">
      <div class="stats-grid">
        <div class="stat"><span id="statBets">0</span><small>Total bets</small></div>
        <div class="stat"><span id="statWagered">0.00</span><small>Wagered</small></div>
        <div class="stat"><span id="statProfit">0.00</span><small>Net profit</small></div>
      </div>
      <h3 class="hist-title">Bet history</h3>
      <div class="history-list" id="historyList"></div>
      <div class="wallet-actions">
        <button class="btn ghost small" onclick="resetBalance()">Reset balance</button>
        <button class="btn ghost small" onclick="clearHistory()">Clear history</button>
      </div>
    </div>
  </div>
</div>

<script src="../app.js"></script>
<script>
  let isUnder = false; 
  let isRolling = false;
  let currentMultiplier = 1.9800;
  let rollHistory = [];

  const MIN_ROLL = 0.01;
  const MAX_ROLL = 99.99;

  function updateUI(source, val = null) {
    if (isRolling) return;
    
    let chance, multiplier, rollOver;

    if (source === 'slider') {
      rollOver = val;
    } else if (source === 'multiplier') {
      multiplier = parseFloat(document.getElementById('multiplierInput').value);
      if (isNaN(multiplier) || multiplier < 1.0101) multiplier = 1.0101;
      if (multiplier > 9900) multiplier = 9900;
      chance = 99 / multiplier;
      rollOver = isUnder ? chance : (100 - chance);
    } else if (source === 'winChance') {
      chance = parseFloat(document.getElementById('winChanceInput').value);
      if (isNaN(chance) || chance < 0.01) chance = 0.01;
      if (chance > 99.99) chance = 99.99;
      multiplier = 99 / chance;
      rollOver = isUnder ? chance : (100 - chance);
    } else if (source === 'rollOver') {
      rollOver = parseFloat(document.getElementById('rollOverInput').value);
      if (isNaN(rollOver) || rollOver < MIN_ROLL) rollOver = MIN_ROLL;
      if (rollOver > MAX_ROLL) rollOver = MAX_ROLL;
      chance = isUnder ? rollOver : (100 - rollOver);
      multiplier = 99 / chance;
    } else if (source === 'swap') {
      isUnder = !isUnder;
      rollOver = 100 - parseFloat(document.getElementById('rollOverInput').value);
      chance = isUnder ? rollOver : (100 - rollOver);
      multiplier = 99 / chance;
    }

    if (rollOver < MIN_ROLL) rollOver = MIN_ROLL;
    if (rollOver > MAX_ROLL) rollOver = MAX_ROLL;
    chance = isUnder ? rollOver : (100 - rollOver);

    // Update DOM
    document.getElementById('sliderHandle').style.left = rollOver + '%';
    document.getElementById('rollOverInput').value = rollOver.toFixed(2);
    document.getElementById('winChanceInput').value = chance.toFixed(4);
    document.getElementById('multiplierInput').value = multiplier.toFixed(4);
    
    currentMultiplier = multiplier;

    // Instantly sync the red/green bars
    const fillRed = document.getElementById('fillRed');
    const fillGreen = document.getElementById('fillGreen');
    
    // We swap the widths and the left/right anchoring to ensure it snaps cleanly
    if (isUnder) {
      fillGreen.style.width = rollOver + '%';
      fillGreen.style.left = '0%';
      fillGreen.style.right = 'auto';
      
      fillRed.style.width = (100 - rollOver) + '%';
      fillRed.style.left = rollOver + '%';
      fillRed.style.right = 'auto';
    } else {
      fillRed.style.width = rollOver + '%';
      fillRed.style.left = '0%';
      fillRed.style.right = 'auto';
      
      fillGreen.style.width = (100 - rollOver) + '%';
      fillGreen.style.left = rollOver + '%';
      fillGreen.style.right = 'auto';
    }

    updateProfit();
    renderHistory();
  }

  function updateFromMultiplier() { updateUI('multiplier'); }
  function updateFromWinChance() { updateUI('winChance'); }
  function updateFromRollOver() { updateUI('rollOver'); }
  function swapMode() { updateUI('swap'); }

  function updateProfit() {
    const bet = parseFloat(document.getElementById('betAmountInput').value) || 0;
    const profit = bet * currentMultiplier - bet;
    document.getElementById('profitInput').value = profit > 0 ? profit.toFixed(8) : "0.00000000";
    document.getElementById('betFiatDisplay').textContent = '$' + bet.toFixed(2);
    document.getElementById('profitFiatDisplay').textContent = '$' + (profit > 0 ? profit.toFixed(2) : "0.00");
  }

  function setBet(action) {
    if (isRolling) return;
    const input = document.getElementById('betAmountInput');
    let current = parseFloat(input.value) || 0;
    if (action === 'half') current = current / 2;
    if (action === 'double') current = current * 2;
    if (current > state.balance) current = state.balance;
    if (current < 0) current = 0;
    input.value = current.toFixed(8);
    updateProfit();
  }

  function renderHistory() {
    const bar = document.getElementById('historyBar');
    const targetVal = parseFloat(document.getElementById('rollOverInput').value);
    
    let html = '';
    // Reversing the loop to render from right to left visually
    for(let i = 4; i >= 0; i--) {
      if (i < rollHistory.length) {
        const roll = rollHistory[i];
        const isWin = isUnder ? (roll < targetVal) : (roll > targetVal);
        const colorClass = isWin ? 'win' : 'loss';
        html += `<div class="history-pill ${colorClass}">${roll.toFixed(2)}</div>`;
      } else {
        html += `<div class="history-pill loss">-</div>`;
      }
    }
    bar.innerHTML = html;
  }

  // --- Drag System ---
  const track = document.getElementById('trackContainer');
  const handle = document.getElementById('sliderHandle');
  let isDragging = false;

  function handleDrag(e) {
    if (isRolling || !isDragging) return;
    e.preventDefault(); 
    
    const rect = track.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let percent = ((clientX - rect.left) / rect.width) * 100;
    
    if (percent < MIN_ROLL) percent = MIN_ROLL;
    if (percent > MAX_ROLL) percent = MAX_ROLL;
    
    updateUI('slider', percent);
  }

  track.addEventListener('mousedown', (e) => { isDragging = true; handleDrag(e); });
  window.addEventListener('mousemove', handleDrag);
  window.addEventListener('mouseup', () => { isDragging = false; });

  track.addEventListener('touchstart', (e) => { isDragging = true; handleDrag(e); }, {passive: false});
  window.addEventListener('touchmove', handleDrag, {passive: false});
  window.addEventListener('touchend', () => { isDragging = false; });


  // --- Main Game Logic ---
  function playDice() {
    if (isRolling) return;
    const betAmt = parseFloat(document.getElementById('betAmountInput').value);
    if (!betAmt || betAmt <= 0) { flash("Invalid bet amount"); return; }
    if (betAmt > state.balance) { flash("Insufficient balance"); return; }
    if (!placeBet('Dice', betAmt)) return;

    isRolling = true;
    document.getElementById('betBtn').disabled = true;
    document.getElementById('betBtn').textContent = "Rolling...";
    
    const cube = document.getElementById('resultCube');
    cube.style.opacity = '0'; 

    const targetVal = parseFloat(document.getElementById('rollOverInput').value);
    const finalRoll = Math.random() * 100; 

    // Start animation FROM the current handle position
    const startX = targetVal; 
    const duration = 600; 
    const startTime = performance.now();

    function animate(time) {
      const elapsed = time - startTime;
      let progress = elapsed / duration;
      if (progress > 1) progress = 1;
      
      // Ease out cubic
      const easeOut = 1 - Math.pow(1 - progress, 3);
      
      // Calculate cube position sliding from handle to result
      const currentX = startX + (finalRoll - startX) * easeOut;
      
      cube.style.left = currentX + '%';
      cube.style.opacity = '1';

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        finishGame(finalRoll, betAmt);
      }
    }
    
    requestAnimationFrame(animate);
  }

  function finishGame(roll, betAmt) {
    const targetVal = parseFloat(document.getElementById('rollOverInput').value);
    let win = false;
    if (isUnder) win = roll < targetVal;
    else win = roll > targetVal;

    // Cube snaps to the final roll position
    const cube = document.getElementById('resultCube');
    cube.textContent = roll.toFixed(2);
    cube.style.color = win ? '#00e701' : '#ff3b3b';
    cube.style.left = roll + '%'; 
    cube.style.opacity = '1';

    // Add to history (unshift puts the newest one at index 0)
    rollHistory.unshift(roll);
    if (rollHistory.length > 5) rollHistory.pop(); 
    
    // Render history (newest is at index 0, so our reversed loop puts it on the right)
    renderHistory();

    // Payout
    const payout = win ? (betAmt * currentMultiplier) : 0;
    if (win) { state.balance += payout; playSound('win'); } 
    else { playSound('lose'); }

    recordBet({ game: 'Dice', amount: betAmt, payout: payout, win: win });

    isRolling = false;
    document.getElementById('betBtn').disabled = false;
    document.getElementById('betBtn').textContent = "Bet";
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('betAmountInput').value = "0.00000000";
    // Initialize at 50.50
    updateUI('slider', 50.50);
  });
</script>
</body>
</html>
