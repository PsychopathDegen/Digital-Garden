
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultPlay | Plinko</title>
  <meta name="theme-color" content="#111419">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="plinko.css">

  <script src="plinko.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <header class="topbar">
    <a href="index.html" class="brand">VAULT<span>PLAY</span></a>

    <div class="topbar-right">
      <div class="balance-display">
        <span>Balance</span>
        <strong id="balance">0.00 USDT</strong>
      </div>
      <button id="deposit-button" class="deposit-button">
        Deposit
      </button>
    </div>
  </header>

  <div class="main-layout">
    <aside class="sidebar">
      <nav>
        <a href="index.html">Casino</a>
        <a href="index.html">Originals</a>
        <a href="#" class="active">Plinko</a>
        <a href="index.html">Favorites</a>
        <a href="index.html">Bet History</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="game-breadcrumb">
        Casino / Originals / Plinko
      </div>

      <div id="plinko-game">
        <p>Loading Plinko...</p>
      </div>
    </main>
  </div>

  <!-- Deposit modal -->
  <div id="deposit-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-deposit" class="modal-close">×</button>

      <h2>Virtual Deposit</h2>
      <p>This is a simulator. No real money is deposited.</p>

      <label for="deposit-amount">Amount (USDT)</label>
      <input
        type="number"
        id="deposit-amount"
        min="1"
        step="0.01"
        placeholder="Enter amount"
      >

      <div class="deposit-quick">
        <button data-amount="10">10</button>
        <button data-amount="50">50</button>
        <button data-amount="100">100</button>
        <button data-amount="500">500</button>
      </div>

      <button id="confirm-deposit">Add virtual balance</button>
    </div>
  </div>

  <script>
    /*
      Standalone wallet integration.
      Balance is stored locally in this browser.
    */

    const WALLET_KEY = "vaultplay-account-v1";

    let currentBalance = 0;

    function loadWallet() {
      try {
        const saved = JSON.parse(localStorage.getItem(WALLET_KEY));
        currentBalance = Number(saved?.balance) || 0;
      } catch {
        currentBalance = 0;
      }

      updateBalanceDisplay();
    }

    function updateBalance(newBalance) {
      currentBalance = Math.max(0, Number(newBalance) || 0);

      localStorage.setItem(
        WALLET_KEY,
        JSON.stringify({ balance: currentBalance })
      );

      updateBalanceDisplay();
    }

    function updateBalanceDisplay() {
      const balanceElement = document.getElementById("balance");

      if (balanceElement) {
        balanceElement.textContent =
          currentBalance.toFixed(2) + " USDT";
      }
    }

    function openDeposit() {
      document.getElementById("deposit-modal").classList.remove("hidden");
    }

    function closeDeposit() {
      document.getElementById("deposit-modal").classList.add("hidden");
    }

    document.getElementById("deposit-button").addEventListener(
      "click", openDeposit
    );

    document.getElementById("close-deposit").addEventListener(
      "click", closeDeposit
    );

    document.querySelectorAll("[data-amount]").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("deposit-amount").value =
          button.dataset.amount;
      });
    });

    document.getElementById("confirm-deposit").addEventListener(
      "click", () => {
        const amount = Number(
          document.getElementById("deposit-amount").value
        );

        if (!Number.isFinite(amount) || amount <= 0) {
          alert("Enter a valid amount.");
          return;
        }

        updateBalance(currentBalance + amount);
        document.getElementById("deposit-amount").value = "";
        closeDeposit();
      }
    );

    // Load saved balance before starting the game.
    loadWallet();

    // Start Plinko using the same wallet as the deposit system.
    window.addEventListener("DOMContentLoaded", () => {
      if (typeof window.mountPlinko !== "function") {
        document.getElementById("plinko-game").innerHTML =
          "<p>Plinko could not load. Check that plinko.js exists.</p>";
        return;
      }

      window.mountPlinko(
        document.getElementById("plinko-game"),
        {
          getBalance: () => currentBalance,
          setBalance: (newBalance) => updateBalance(newBalance)
        }
      );
    });
  </script>
</body>
</html>
